site_name: Scripture Indexer
site_description: Automatic indexing of Latin manuscripts containing biblical quotes.
repo_url: https://github.com/SphRbtHyk/scripture-indexer

theme:
  name: material
  language: en
  logo: assets/logo.jpg
  favicon: assets/logo.jpg
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top

nav:
  - Overview: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - How it works: how_it_works.md
  - CLI reference: cli.md
  - Output formats: outputs.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true
