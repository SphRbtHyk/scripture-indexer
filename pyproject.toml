[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scripture-indexer"
version = "0.0.1"
dependencies = [
    "PyYAML",
]
requires-python = ">=3.8"
authors = [
  {name = "Sophie Robert-Hayek", email = "sophie.robert@sorbonne-universite.fr"},
]
description = "Script for automatic indexing of Latin manuscripts containing biblical quotes."
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
test = ["pytest"]
docs = [
    "mkdocs",
    "mkdocs-material",
]
htr = [
    "kraken",
    "Pillow",
    "PyMuPDF",
]

[project.scripts]
scripture-indexer = "scripture_indexer.run_full_pipeline:main"